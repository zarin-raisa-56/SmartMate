*{box-sizing:border-box}

body{margin:0;background-color:var(--bg);background-image:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--fg);font:400 1rem/1.5 'Nunito','Noto Sans Bengali',system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100vh;-webkit-text-size-adjust:100%}

p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:10px}

.sm{font-size:.85rem}
.xs{font-size:.78rem}
.b{font-weight:800}
.tn{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 0;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mt{margin-top:14px}
.hide{display:none!important}

/* layout */
.app{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding-block:20px}
.side{position:sticky;top:20px;align-self:start;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:16px 12px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 40px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font:700 1.3rem 'Fraunces',Georgia,serif}
.nv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;border:0;background:none;color:var(--muted);font-weight:700;text-align:left;width:100%}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--accent-soft);color:var(--on-accent-soft)}
.nv svg,.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sidefoot{margin-top:auto;padding:10px 6px 2px;display:flex;gap:8px}
.view{min-width:0;padding-bottom:40px}
.topbar{display:none;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.topbar .brand{padding:0}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -6px 24px hsl(var(--h) 45% 30% / .14);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;border-radius:22px 22px 0 0}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.7rem;font-weight:700;padding:6px 8px;border-radius:14px;min-width:56px}
.tb.on{color:var(--on-accent-soft);background:var(--accent-soft)}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{color:var(--muted)}

/* surfaces */
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow-sm);padding:18px;min-width:0}
.card.flat{box-shadow:none;background:var(--surface2)}
.card h3{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:var(--act);color:var(--on-act);box-shadow:var(--shadow-sm);transition:transform .12s,filter .12s;line-height:1.2;text-align:center}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--accent-soft);color:var(--on-accent-soft);box-shadow:none}
.btn.line{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--on-accent-soft);flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{background:var(--accent);color:var(--on-accent)}
.iconbtn.sm{width:30px;height:30px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;border:0;background:var(--surface2);color:var(--muted);font-weight:700;font-size:.88rem;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow-sm);overflow-x:auto;max-width:100%;margin-bottom:16px;width:fit-content}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:800;color:var(--muted);font-size:.9rem}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:800;background:var(--accent-soft);color:var(--on-accent-soft)}
.badge.ok{background:var(--good-bg);color:var(--good)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.mint{background:var(--mint);color:var(--on-mint)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:800;color:var(--muted)}
.in,input[type=text],input[type=number],input[type=date],input[type=password],input[type=datetime-local],input[type=search],select,textarea{width:100%;min-width:0;border:0;border-radius:14px;padding:10px 14px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--fg)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--ring);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent);box-shadow:none}
.ferr{color:var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:12px;font-weight:700;font-size:.9rem}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.tg{position:relative;width:46px;height:26px;border-radius:999px;border:0;background:var(--line);flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .2s}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(20px)}

/* calculator */
.calcwrap{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
.calc{background:var(--surface);border-radius:32px;padding:18px;box-shadow:var(--shadow);width:100%}
.cmodes{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cd{background:var(--mint);color:var(--on-mint);border-radius:22px;padding:12px 18px 14px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;box-shadow:inset 0 2px 8px hsl(158 40% 30% / .12);overflow:hidden}
.cd-top{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;opacity:.75;min-height:1.2em}
.cd-expr{font-size:1.15rem;font-weight:600;min-height:1.6em;overflow-x:auto;white-space:nowrap;scrollbar-width:none;direction:ltr}
.cd-res{font-size:2.5rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cd-res.err{font-size:1.1rem;color:var(--bad);line-height:1.3}
.cd.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keys{display:grid;gap:9px;margin-top:12px}
.keys.c4{grid-template-columns:repeat(4,1fr)}
.keys.c5{grid-template-columns:repeat(5,1fr)}
.key{border:0;border-radius:18px;padding:0;height:56px;font-size:1.2rem;font-weight:800;background:var(--key);color:var(--fg);box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s,filter .1s;min-width:0}
.key:hover{filter:brightness(.97)}
.key:active{transform:translateY(3px) scale(.97);box-shadow:0 0 0 var(--line)}
.key.op{background:var(--act);color:var(--on-act);box-shadow:0 3px 0 hsl(var(--h2) 70% 76%)}
.key.fn{background:var(--accent-soft);color:var(--on-accent-soft);font-size:1rem;box-shadow:0 3px 0 hsl(var(--h) 40% 82% / .8)}
.key.mem{height:38px;font-size:.85rem;background:transparent;color:var(--muted);box-shadow:none}
.key.eq{background:var(--accent);color:var(--on-accent);grid-column:span 3;box-shadow:0 3px 0 hsl(var(--h) 50% 36%)}
.key.sp{height:48px}
.hist{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.hrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--surface2)}
.hrow .hx{flex:1;min-width:0;text-align:right;border:0;background:none;padding:0}
.hrow .he{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.hrow .hr{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}

/* generic list rows */
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface2)}
.li+.li{margin-top:8px}
.li .grow{min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

/* modal & toast */
.mw{position:fixed;inset:0;z-index:50;background:hsl(var(--h) 40% 12% / .55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .15s}
.modal{background:var(--surface);color:var(--fg);border-radius:26px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;animation:pop .2s}
.modal.wide{max-width:760px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 8px}
.mb{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:10px 18px 16px}

.toast.ok{background:var(--good);color:var(--good-bg)}
.toast.bad{background:var(--bad);color:var(--bad-bg)}
.toast.out{opacity:0;transition:opacity .3s}
.remBar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.rem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:16px;font-weight:700}

/* home */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.clock{text-align:right}

.fb{border-radius:18px;padding:12px 16px;font-weight:700}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .steps{font-weight:600;color:var(--fg);margin-top:8px}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.qin{font-size:1.3rem;font-weight:800;text-align:center;max-width:260px}
.mcq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:0;border-radius:16px;padding:14px;font-weight:800;font-size:1.05rem;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left}
.opt.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.opt.right{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.opt.wrong{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.stat{background:var(--surface2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 1.6rem/1.1 'Fraunces',Georgia,serif;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.fcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surface2);border:0;width:100%;text-align:left}
.fcard+.fcard{margin-top:8px}
.fcard .expr{font-size:1.1rem;line-height:1.6;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.fgrid .fcard+.fcard{margin-top:0}

.dlayout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dn{font-size:.7rem;font-weight:800;color:var(--muted);padding:3px 0}

.cal button:hover{background:var(--accent-soft)}

.pinin{text-align:center;letter-spacing:.5em;font-size:1.5rem;font-weight:800;max-width:240px}

.xnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}

.scale{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,hsl(200 70% 65%) 0 18%,hsl(150 55% 55%) 18% 42%,hsl(40 90% 60%) 42% 62%,hsl(5 75% 62%) 62%);margin:18px 0 6px}

.symbar{display:flex;gap:6px;flex-wrap:wrap}
.symbar button{border:0;border-radius:10px;background:var(--accent-soft);color:var(--on-accent-soft);min-width:34px;height:32px;font-weight:800}

let ac = null;
function sound(freq, dur) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), d = dur || 0.06;
    o.type = 'sine'; o.frequency.value = freq || 520; g.gain.value = 0.04; o.connect(g); g.connect(ac.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.stop(ac.currentTime + d);

}

/* ---------- math text markup: <sup> <sub> <i> <b> <br> <f>num|den</f> ---------- */
function fm(s) {
  let o = esc(s);
  o = o.replace(/&lt;(\/?)(sup|sub|i|b)&gt;/g, '<$1$2>').replace(/&lt;br&gt;/g, '<br>');
  o = o.replace(/&lt;f&gt;([\s\S]*?)\|([\s\S]*?)&lt;\/f&gt;/g, '<span class="fr"><span>$1</span><span>$2</span></span>');
  return o;
}
function plain(s) {
  return String(s == null ? '' : s).replace(/<f>([\s\S]*?)\|([\s\S]*?)<\/f>/g, '($1)/($2)')
    .replace(/<sup>(.*?)<\/sup>/g, (m, a) => '^' + (a.length > 1 ? '(' + a + ')' : a)).replace(/<sub>(.*?)<\/sub>/g, '_$1')
    .replace(/<br>/g, '\n').replace(/<\/?(i|b)>/g, '');
}
// typed text (personal formulas) -> markup
function userMath(s) {
  return String(s == null ? '' : s).replace(/\^\(([^)]*)\)/g, '<sup>$1</sup>').replace(/\^(-?[A-Za-z0-9.]+)/g, '<sup>$1</sup>')
    .replace(/_\(([^)]*)\)/g, '<sub>$1</sub>').replace(/sqrt\(/gi, '√(').replace(/\bpi\b/g, 'π');
}

/* markup helpers used by formulas and question generators */
const fr = (n, d) => '<f>' + n + '|' + d + '</f>';

/* ============ Calculator (basic + scientific) ============ */
const Calc = (() => {
  const CS = { expr: '', res: null, just: false, last: '', prev: '0', err: '', mode: Store.get('calcMode', 'basic'), ans: null };
  let replayTimers = [];
  const disp = s => String(s).replace(/-/g, '−');
  const resText = v => disp(Engine.fmt(v));
  const OPS = '+−×÷^';
  const FN_RE = /(sin|cos|tan|log|ln|√)\($/;

  function evalNow(expr) {
    let e = expr; const open = (e.match(/\(/g) || []).length - (e.match(/\)/g) || []).length;
    if (open > 0) e += ')'.repeat(open);
    return { e, r: Engine.evaluate(e, { angle: S.angle, ans: CS.ans }) };
  }
  function pushHist(expr, text) {
    if (!S.saveCalcHistory) return;
    D.calcHist.unshift({ id: uid(), ts: Date.now(), expr: disp(expr), res: disp(text) });
    if (D.calcHist.length > 300) D.calcHist.length = 300;
    save('calcHist');
  }
  function startNew() { if (CS.just) { CS.expr = ''; CS.just = false; } }
  function lastNumber() { const m = /[0-9.]+$/.exec(CS.expr); return m ? m[0] : ''; }

  function press(k) {
    CS.err = '';

    if (dig) { startNew(); CS.expr += k; sound(480, .04); }
    else if (k === '.') { startNew(); const n = lastNumber(); if (n.includes('.')) return; CS.expr += n === '' ? '0.' : '.'; sound(480, .04); }
    else if (OPS.includes(k)) {
      if (CS.just) CS.just = false;
      if (CS.expr === '') { if (k === '−') CS.expr = '−'; else if (CS.res != null) CS.expr = resText(CS.res) + k; }
      else if (new RegExp('[' + OPS.replace('^', '\\^') + ']$').test(CS.expr)) { if (k === '−' && /[×÷\^]$/.test(CS.expr)) CS.expr += k; else CS.expr = CS.expr.slice(0, -1) + k; }
      else if (/\($/.test(CS.expr) && k !== '−') { /* ignore operator right after ( */ }
      else CS.expr += k;
      sound(620, .05);
    }
    else if (k === '(') { startNew(); CS.expr += '('; }
    else if (k === ')') { const o = (CS.expr.match(/\(/g) || []).length, c = (CS.expr.match(/\)/g) || []).length; if (o > c && !/[(+−×÷^]$/.test(CS.expr)) CS.expr += ')'; }
    else if (k === '%') { if (CS.just) CS.just = false; if (/[0-9)]$/.test(CS.expr)) CS.expr += '%'; }
    else if (['sin', 'cos', 'tan', 'log', 'ln'].includes(k)) { startNew(); CS.expr += k + '('; }
    else if (k === '√') { startNew(); CS.expr += '√('; }
    else if (k === 'x²' || k === 'x³' || k === 'xʸ' || k === 'n!') {
      if (CS.just) CS.just = false;
      if (CS.expr === '' && CS.res != null) CS.expr = resText(CS.res);
      if (CS.expr === '' || /[+−×÷^(]$/.test(CS.expr)) { CS.err = 'Enter a number first'; }
      else CS.expr += k === 'x²' ? '^2' : k === 'x³' ? '^3' : k === 'xʸ' ? '^' : '!';
    }
    else if (k === 'π' || k === 'e' || k === 'Ans') { startNew(); CS.expr += k; }
    else if (k === '1/x') {
      if (CS.just) CS.just = false;
      if (CS.expr === '' && CS.res != null) CS.expr = resText(CS.res);
      if (CS.expr === '') { CS.err = 'Enter a number first'; } else { CS.expr = '1÷(' + CS.expr + ')'; return press('='); }
    }
    else if (k === '±') {
      if (CS.just) { CS.expr = CS.expr.startsWith('−') ? CS.expr.slice(1) : '−' + CS.expr; CS.res = -CS.res; }
      else { const m = /\(−([0-9.]+)\)$/.exec(CS.expr); const n = lastNumber(); if (m) CS.expr = CS.expr.slice(0, m.index) + m[1]; else if (n) CS.expr = CS.expr.slice(0, CS.expr.length - n.length) + '(−' + n + ')'; else CS.expr += '(−'; }
    }
    else if (k === '⌫') { CS.just = false; CS.expr = FN_RE.test(CS.expr) ? CS.expr.replace(FN_RE, '') : CS.expr.slice(0, -1); }
    else if (k === 'C') { CS.expr = ''; CS.res = null; CS.just = false; CS.prev = '0'; CS.last = ''; }
    else if (k === '=') { equals(); }
    else if (k === 'MC') { D.calcMem = 0; save('calcMem'); toast('Memory cleared'); }
    else if (k === 'MR') { startNew(); const m = D.calcMem; CS.expr += m < 0 ? '(' + resText(m) + ')' : resText(m); }
    else if (k === 'M+' || k === 'M−') {
      try { const v = CS.just ? CS.res : (CS.expr ? evalNow(CS.expr).r.value : 0); D.calcMem = parseFloat((D.calcMem + (k === 'M+' ? v : -v)).toPrecision(12)); save('calcMem'); toast('Memory: ' + resText(D.calcMem)); }
      catch (e) { CS.err = e.message || 'Invalid expression'; }
    }
    else if (k === 'DEG') { S.angle = S.angle === 'deg' ? 'rad' : 'deg'; saveSettings(); }
    update();
  }
  function equals() {
    if (CS.expr === '' || CS.just) return;
    try {
      const { e, r } = evalNow(CS.expr);
      pushHist(e, r.text);
      CS.last = e + ' ='; CS.res = r.value; CS.ans = r.value; CS.expr = resText(r.value); CS.just = true; CS.prev = resText(r.value); CS.err = '';
      sndOK(); renderHist();
    } catch (e) {
      CS.err = e instanceof CalcError ? e.message : 'That expression is not valid';
      sndBad(); const el = $('#cd'); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    }
  }
  function update() {
    const x = $('#cdExpr'); if (!x) return;
    if (!CS.just) {
      if (CS.expr === '') CS.prev = '0';
      else { try { CS.prev = resText(evalNow(CS.expr).r.value); } catch (e) { /* keep last valid preview */ } }
    }
    x.textContent = CS.just ? CS.last : CS.expr; x.scrollLeft = x.scrollWidth;

  function renderHist() {

  }

  function html() {
    const sci = CS.mode === 'sci';
    const sciKeys = [['sin', 'sin'], ['cos', 'cos'], ['tan', 'tan'], ['log', 'log'], ['ln', 'ln'], ['x²', 'x²'], ['x³', 'x³'], ['xʸ', 'xʸ'], ['√', '√'], ['n!', 'n!'], ['π', 'π'], ['e', 'e'], ['1/x', '1/x'], ['Ans', 'Ans'], [S.angle === 'deg' ? 'DEG' : 'RAD', 'DEG']];
    return `<div class="calc" id="calcBox">

      ${sci ? `<div class="keys c5">${sciKeys.map(([l, k]) => keyBtn(l, k, 'fn sp')).join('')}</div>` : ''}
      <div class="keys c4" style="margin-top:6px">${['MC', 'MR', 'M+', 'M−'].map(m => keyBtn(m, m, 'mem')).join('')}</div>
      <div class="keys c4" style="margin-top:2px">

        ${keyBtn('4', '4')}${keyBtn('5', '5')}${keyBtn('6', '6')}${keyBtn('×', '×', 'op')}
        ${keyBtn('1', '1')}${keyBtn('2', '2')}${keyBtn('3', '3')}${keyBtn('−', '−', 'op')}
        ${keyBtn('0', '0')}${keyBtn('.', '.')}${keyBtn('%', '%', 'fn')}${keyBtn('+', '+', 'op')}

      renderHist(); update();
    }
  };
  A.calcMode = b => { CS.mode = b.dataset.v; Store.set('calcMode', CS.mode); refresh(); };
  A.calcCopy = () => { const txt = CS.just ? CS.expr : CS.prev; copyText(txt.replace(/−/g, '-'), 'Result copied'); };
  A.calcUse = b => { const x = D.calcHist.find(h => h.id === b.dataset.id); if (!x) return; if (CS.just) { CS.expr = ''; CS.just = false; } CS.expr += x.res; CS.err = ''; update(); };
  A.calcCopyH = b => { const x = D.calcHist.find(h => h.id === b.dataset.id); if (x) copyText(x.res.replace(/−/g, '-'), 'Result copied'); };

  A.calcReplay = b => {
    const x = D.calcHist.find(h => h.id === b.dataset.id); if (!x) return;
    replayTimers.forEach(clearTimeout); replayTimers = [];
    CS.expr = ''; CS.just = false; CS.err = ''; update();
    const chars = Array.from(x.expr);
    if (!S.anim) { CS.expr = x.expr; update(); equals(); update(); return; }
    chars.forEach((c, i) => replayTimers.push(setTimeout(() => { CS.expr += c; update(); sound(480, .03); }, 70 * (i + 1))));
    replayTimers.push(setTimeout(() => { equals(); update(); }, 70 * (chars.length + 3)));
  };
  function key(e) {
    if (cur !== 'calculator' || e.ctrlKey || e.metaKey || e.altKey || $('.mw')) return;
    const tg = e.target; if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
    if (tg && tg.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ') && !tg.closest('.calc')) return;
    const k = e.key; let m = null;
    if (/^[0-9]$/.test(k)) m = k; else if (k === '.') m = '.';
    else if (k === '+') m = '+'; else if (k === '-') m = '−'; else if (k === '*' || k === 'x') m = '×'; else if (k === '/') m = '÷';
    else if (k === '^') m = '^'; else if (k === '(' || k === ')') m = k; else if (k === '%') m = '%'; else if (k === '!') m = 'n!';
    else if (k === 'Enter' || k === '=') m = '='; else if (k === 'Backspace') m = '⌫'; else if (k === 'Escape' || k === 'Delete') m = 'C';
    else if (k === 'p') m = 'π';

  }
  // used by the dashboard mini calculator
  function quick(src) {
    const r = Engine.evaluate(src, { angle: S.angle, ans: CS.ans });
    pushHist(src.trim(), r.text); CS.ans = r.value; return r;
  }
  function load(expr) { CS.expr = expr; CS.just = false; CS.err = ''; }
  return { press, key, quick, load, state: CS };
})();

/* ============ Diary & notes, protected by an encrypted PIN vault ============ */
const CATS = ['Personal', 'Study', 'Important', 'Ideas', 'Daily Journal', 'Others'];
const TYPES = { diary: 'Diary entry', note: 'Note', todo: 'To-do list' };

const Vault = {
  meta: null, key: null, unlocked: false,
  supported: !!(window.crypto && crypto.subtle && window.TextEncoder),
  b64(buf) { let s = ''; new Uint8Array(buf).forEach(x => { s += String.fromCharCode(x); }); return btoa(s); },
  unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
  async derive(pin, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: this.b64(iv), ct: this.b64(ct) };
  },
  async open(key, box) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: this.unb64(box.iv) }, key, this.unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
};

const Diary = {
  entries: [], f: { q: '', cat: 'All', view: 'all', date: null }, cal: { y: new Date().getFullYear(), m: new Date().getMonth() }, notified: {},
  hasPin() { return !!Vault.meta; },
  isLocked() { return !!Vault.meta && !Vault.unlocked; },
  load() {
    Vault.meta = Store.get('vault', null); Vault.key = null; Vault.unlocked = false; this.entries = [];
    if (!Vault.meta) { const v = Store.get('diary', []); this.entries = Array.isArray(v) ? v : []; }
  },
  lock() { if (Vault.meta) { Vault.key = null; Vault.unlocked = false; this.entries = []; } },
  async persist() {
    if (Vault.meta) { if (!Vault.unlocked) throw new Error('locked'); Store.set('diary', await Vault.seal(Vault.key, this.entries)); }
    else Store.set('diary', this.entries);
  },
  async unlock(pin) {
    const m = Vault.meta; if (!m) return { ok: true };
    const wait = (m.lockUntil || 0) - Date.now();
    if (wait > 0) return { ok: false, msg: 'Too many wrong PINs. Try again in ' + Math.ceil(wait / 1000) + ' seconds.' };
    try {
      const key = await Vault.derive(pin, Vault.unb64(m.salt));
      await Vault.open(key, m.verify);
      const box = Store.get('diary', null);
      this.entries = box && box.ct ? await Vault.open(key, box) : [];
      Vault.key = key; Vault.unlocked = true; m.fails = 0; m.lockUntil = 0; Store.set('vault', m);
      return { ok: true };
    } catch (e) {
      m.fails = (m.fails || 0) + 1;
      if (m.fails >= 5) { m.lockUntil = Date.now() + 30000 * Math.min(m.fails - 4, 10); }
      Store.set('vault', m);
      return { ok: false, msg: m.fails >= 5 ? 'Too many wrong PINs. Wait a moment before trying again.' : 'That PIN is not correct. ' + (5 - m.fails) + ' tries left before a short wait.' };
    }
  },
  async setPin(pin) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await Vault.derive(pin, salt);
    const meta = { v: 1, salt: Vault.b64(salt), fails: 0, lockUntil: 0, verify: await Vault.seal(key, 'smartmate') };
    Vault.meta = meta; Vault.key = key; Vault.unlocked = true; Store.set('vault', meta);
    await this.persist();
  },
  async checkPin(pin) {
    try { const key = await Vault.derive(pin, Vault.unb64(Vault.meta.salt)); await Vault.open(key, Vault.meta.verify); return true; } catch (e) { return false; }
  },
  async removePin() { Vault.meta = null; Vault.key = null; Vault.unlocked = false; Store.del('vault'); Store.set('diary', this.entries); },
  eraseAll() { Store.del('diary'); Store.del('vault'); Vault.meta = null; Vault.key = null; Vault.unlocked = false; this.entries = []; D.remind = []; save('remind'); },
  syncRemind(e) {
    D.remind = D.remind.filter(r => r.id !== e.id);
    if (e.rem && !e.remDone) D.remind.push({ id: e.id, at: e.rem });
    save('remind');
  },
  async upsert(e) {
    const i = this.entries.findIndex(x => x.id === e.id);
    if (i >= 0) this.entries[i] = e; else this.entries.push(e);
    await this.persist(); this.syncRemind(e);
  },
  async remove(id) {
    this.entries = this.entries.filter(x => x.id !== id);
    D.remind = D.remind.filter(r => r.id !== id); save('remind');
    await this.persist();
  },
  async quickAdd(text) {
    const body = text.trim(); const first = body.split('\n')[0];
    const now = Date.now();
    await this.upsert({ id: uid(), type: 'note', title: first.length > 48 ? first.slice(0, 46) + '…' : first, body, items: [], cat: 'Personal', date: dkey(), created: now, updated: now, pin: false, fav: false, rem: null, remDone: false });
  },
  sorted(list) { return list.slice().sort((a, b) => (b.pin - a.pin) || (b.date > a.date ? 1 : b.date < a.date ? -1 : 0) || (b.created - a.created)); },
  filtered() {
    const f = this.f, q = f.q.trim().toLowerCase();
    return this.sorted(this.entries.filter(e => {
      if (f.cat !== 'All' && e.cat !== f.cat) return false;
      if (f.view === 'pinned' && !e.pin) return false;
      if (f.view === 'fav' && !e.fav) return false;
      if (f.view === 'todo' && e.type !== 'todo') return false;
      if (f.view === 'diary' && e.type !== 'diary') return false;
      if (f.view === 'note' && e.type !== 'note') return false;
      if (f.date && e.date !== f.date) return false;
      if (q) { const hay = (e.title + ' ' + e.body + ' ' + e.cat + ' ' + (e.items || []).map(i => i.t).join(' ')).toLowerCase(); if (!hay.includes(q)) return false; }
      return true;
    }));
  }
};

/* ---------- views ---------- */
function lockScreen() {

    <div class="ferr" id="pinErr" hidden></div>
    <button class="btn pri" data-act="diaryUnlock">${ICON.lock}${t('Unlock')}</button>
    <button class="btn line sm" data-act="diaryForgot">I forgot my PIN</button></div>`;
}
function diaryShell() {
  const f = Diary.f;
  const viewChips = [['all', 'All'], ['pinned', 'Pinned'], ['fav', 'Favourites'], ['diary', 'Diary'], ['note', 'Notes'], ['todo', 'To-do']];
  return pageHead('Diary', 'Entries, notes and to-do lists, saved on this device.',
    `<button class="btn pri" data-act="edNew">${ICON.plus}${t('New entry')}</button><button class="btn" data-act="edToday">Today’s journal</button>` +
    (Diary.hasPin() ? `<button class="btn ghost" data-act="diaryLockNow">${ICON.lock}${t('Lock')}</button>` : `<button class="btn ghost" data-act="pinSetup">${ICON.lock}Set PIN</button>`)) +
    (!Diary.hasPin() ? `<div class="rem" style="background:var(--accent-soft);color:var(--on-accent-soft);margin-bottom:14px">${ICON.lock}<span class="grow">Your diary is not locked. Set a PIN to encrypt it.</span><button class="btn pri sm" data-act="pinSetup">Set PIN</button></div>` : '') +
    `<div class="dlayout"><div class="col">
      <div class="card"><div class="row sb" style="margin-bottom:8px"><button class="iconbtn sm" data-act="calPrev" aria-label="Previous month">‹</button><b id="calTitle"></b><button class="iconbtn sm" data-act="calNext" aria-label="Next month">›</button></div><div class="cal" id="calGrid"></div>
        <div class="row sb mt"><span class="xs muted" id="dateInfo"></span><button class="btn ghost sm" data-act="dateClear">Show all dates</button></div></div>
      <div class="card"><h3>Categories</h3><div class="chips" id="catChips"></div></div></div>
      <div class="col" style="min-width:0">
        <div class="card"><div class="field"><label for="dq">${t('Search')}</label><input id="dq" type="search" placeholder="Search titles, text and to-do items" value="${esc(f.q)}" data-inp="diarySearch"></div>
          <div class="chips mt">${viewChips.map(([id, l]) => `<button class="chip ${f.view === id ? 'on' : ''}" data-act="diaryView" data-v="${id}">${l}</button>`).join('')}</div></div>
        <div id="dlist"></div></div></div>`;
}
function entryCard(e) {
  const todo = e.type === 'todo';
  const doneN = todo ? (e.items || []).filter(i => i.d).length : 0;
  return `<article class="entry">
    <div class="row sb"><div class="row" style="gap:6px"><span class="badge">${esc(TYPES[e.type] || 'Entry')}</span><span class="badge mint">${esc(e.cat)}</span>${e.pin ? '<span class="badge warn">Pinned</span>' : ''}${e.rem && !e.remDone ? `<span class="badge warn">${ICON.bell.replace('class="ic"', 'class="ic" style="width:12px;height:12px"')} ${fmtDT(e.rem)}</span>` : ''}</div>
      <div class="row" style="gap:6px"><button class="iconbtn sm ${e.pin ? 'on' : ''}" data-act="edPin" data-id="${e.id}" aria-label="Pin" aria-pressed="${!!e.pin}">${ICON.pin}</button><button class="iconbtn sm ${e.fav ? 'on' : ''}" data-act="edFav" data-id="${e.id}" aria-label="Favourite" aria-pressed="${!!e.fav}">${ICON.star}</button><button class="iconbtn sm" data-act="edOpen" data-id="${e.id}" aria-label="Edit">${ICON.edit}</button><button class="iconbtn sm" data-act="edDel" data-id="${e.id}" aria-label="Delete">${ICON.trash}</button></div></div>
    <h3>${esc(e.title)}</h3>
    ${todo ? `<div class="tdl">${(e.items || []).map((it, i) => `<label class="tdi ${it.d ? 'done' : ''}"><input type="checkbox" ${it.d ? 'checked' : ''} data-chg="tdToggle" data-id="${e.id}" data-i="${i}"><span>${esc(it.t)}</span></label>`).join('')}<span class="xs muted">${doneN} of ${(e.items || []).length} done</span></div>` : ''}
    ${e.body ? `<div class="body">${esc(e.body.length > 400 ? e.body.slice(0, 400) + '…' : e.body)}</div>` : ''}
    <div class="xs muted">${fmtDate(e.date)} · Created ${fmtDT(e.created)}${e.updated !== e.created ? ' · Edited ' + fmtDT(e.updated) : ''}</div></article>`;
}
function renderDiaryList() {
  const el = $('#dlist'); if (!el) return;
  const list = Diary.filtered();
  el.innerHTML = list.length ? list.map(entryCard).join('') : `<div class="card">${Diary.entries.length ? emptyBox('No matching entries', 'Try a different search, category or date.') : emptyBox('Your diary is empty', 'Press “New entry” or “Today’s journal” to write your first page.')}</div>`;
  const cc = $('#catChips');
  if (cc) cc.innerHTML = ['All'].concat(CATS).map(c => { const n = c === 'All' ? Diary.entries.length : Diary.entries.filter(e => e.cat === c).length; return `<button class="chip ${Diary.f.cat === c ? 'on' : ''}" data-act="diaryCat" data-v="${c}">${c} · ${n}</button>`; }).join('');
  renderCal();
}
function renderCal() {
  const g = $('#calGrid'); if (!g) return;
  const { y, m } = Diary.cal; $('#calTitle').textContent = MONL[m] + ' ' + y;
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const has = {}; Diary.entries.forEach(e => { has[e.date] = true; });
  let h = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<div class="dn">${d}</div>`).join('') + '<button class="pad" tabindex="-1" aria-hidden="true"></button>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = y + '-' + pad(m + 1) + '-' + pad(d);
    h += `<button class="${k === dkey() ? 'today' : ''} ${k === Diary.f.date ? 'sel' : ''} ${has[k] ? 'has' : ''}" data-act="diaryDate" data-d="${k}" aria-label="${fmtDate(k)}">${d}</button>`;
  }
  g.innerHTML = h;
  $('#dateInfo').textContent = Diary.f.date ? 'Showing ' + fmtDate(Diary.f.date) : 'Showing every date';
}
Views.diary = {
  render(el) {
    if (Diary.isLocked()) { el.innerHTML = pageHead('Diary', '') + lockScreen(); return; }
    el.innerHTML = diaryShell(); renderDiaryList();
  }
};

/* ---------- actions ---------- */
A.diaryUnlock = async () => {
  const pin = val('pinIn'); if (!/^\d{4,8}$/.test(pin)) { showErr('pinErr', 'Enter your 4 to 8 digit PIN.'); return; }
  const r = await Diary.unlock(pin);
  if (r.ok) { toast('Diary unlocked', 'ok'); refresh(); checkReminders(); } else { showErr('pinErr', r.msg); const i = $('#pinIn'); if (i) { i.value = ''; i.focus(); } }
};
A.diaryLockNow = () => { Diary.lock(); toast('Diary locked'); refresh(); };
A.diaryForgot = () => confirmBox('A forgotten PIN cannot be recovered because your diary is encrypted with it. You can erase the diary and PIN to start fresh. This deletes all diary entries and notes. Continue?', 'Erase diary', () => { Diary.eraseAll(); toast('Diary erased and PIN removed'); refresh(); }, true);
A.diaryCat = b => { Diary.f.cat = b.dataset.v; renderDiaryList(); };
A.diaryView = b => { Diary.f.view = b.dataset.v; refresh(); };
A.diaryDate = b => { Diary.f.date = Diary.f.date === b.dataset.d ? null : b.dataset.d; renderDiaryList(); };
A.dateClear = () => { Diary.f.date = null; renderDiaryList(); };
A.calPrev = () => { Diary.cal.m--; if (Diary.cal.m < 0) { Diary.cal.m = 11; Diary.cal.y--; } renderCal(); };
A.calNext = () => { Diary.cal.m++; if (Diary.cal.m > 11) { Diary.cal.m = 0; Diary.cal.y++; } renderCal(); };
I.diarySearch = el => { Diary.f.q = el.value; renderDiaryList(); };
async function guarded(fn) { try { await fn(); } catch (e) { toast('Could not save. ' + (e && e.message === 'locked' ? 'Unlock the diary first.' : 'Storage may be full or blocked.'), 'bad'); } }
A.edPin = b => guarded(async () => { const e = Diary.entries.find(x => x.id === b.dataset.id); if (!e) return; e.pin = !e.pin; await Diary.persist(); renderDiaryList(); });
A.edFav = b => guarded(async () => { const e = Diary.entries.find(x => x.id === b.dataset.id); if (!e) return; e.fav = !e.fav; await Diary.persist(); renderDiaryList(); });
I.tdToggle = el => guarded(async () => { const e = Diary.entries.find(x => x.id === el.dataset.id); if (!e) return; e.items[+el.dataset.i].d = el.checked; e.updated = Date.now(); await Diary.persist(); renderDiaryList(); });
A.edDel = b => { const e = Diary.entries.find(x => x.id === b.dataset.id); if (!e) return; confirmBox('Delete “' + e.title + '”? This cannot be undone.', 'Delete', () => guarded(async () => { await Diary.remove(e.id); toast('Entry deleted'); if (cur === 'diary') renderDiaryList(); else refresh(); }), true); };

function todoRow(it) { return `<div class="tdrow"><input type="checkbox" class="td-d" ${it && it.d ? 'checked' : ''} aria-label="Done"><input type="text" class="td-t" value="${esc(it ? it.t : '')}" placeholder="To-do item" maxlength="200"><button class="iconbtn sm" data-act="tdDel" aria-label="Remove item" type="button">${ICON.x}</button></div>`; }
function editorHTML(e) {
  const toLocal = ts => { if (!ts) return ''; const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  return `<input type="hidden" id="edId" value="${esc(e.id || '')}">
    <div class="formgrid"><div class="field"><label for="edType">Type</label><select id="edType" data-chg="edType">${Object.keys(TYPES).map(k => `<option value="${k}" ${e.type === k ? 'selected' : ''}>${TYPES[k]}</option>`).join('')}</select></div>
      <div class="field"><label for="edCat">Category</label><select id="edCat">${CATS.map(c => `<option ${e.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label for="edDate">Date</label><input id="edDate" type="date" value="${esc(e.date)}"></div></div>
    <div class="field"><label for="edTitle">Title</label><input id="edTitle" type="text" maxlength="120" value="${esc(e.title)}" placeholder="Give it a short title"></div>
    <div class="field" id="edBodyBox"><label for="edBody">Description</label><textarea id="edBody" rows="7" placeholder="Write here…">${esc(e.body)}</textarea></div>
    <div class="field ${e.type === 'todo' ? '' : 'hide'}" id="edItemsBox"><label>Checklist</label><div class="col" id="edItems" style="gap:8px">${(e.items || []).map(todoRow).join('')}</div><button class="btn ghost sm" data-act="tdAdd" type="button" style="align-self:flex-start">${ICON.plus}Add item</button></div>
    <div class="formgrid"><div class="field"><label for="edRem">Reminder (optional)</label><input id="edRem" type="datetime-local" value="${toLocal(e.rem && !e.remDone ? e.rem : null)}"></div>
      <div class="field"><label>Options</label><label class="chk"><input type="checkbox" id="edPinC" ${e.pin ? 'checked' : ''}> Pin to top</label><label class="chk"><input type="checkbox" id="edFavC" ${e.fav ? 'checked' : ''}> Favourite</label></div></div>
    <div class="ferr" id="edErr" hidden></div>`;
}
function openEditor(e) {
  modal({ title: e.created ? 'Edit entry' : 'New entry', wide: true, body: editorHTML(e), actions: `<button class="btn ghost" data-act="closeModal">${t('Cancel')}</button><button class="btn pri" data-act="edSave">${ICON.check}${t('Save')}</button>` });
}
const blankEntry = (o) => Object.assign({ id: '', type: 'diary', title: '', body: '', items: [], cat: 'Personal', date: dkey(), created: 0, updated: 0, pin: false, fav: false, rem: null, remDone: false }, o || {});
function needOpen() { if (Diary.isLocked()) { toast('Unlock your diary first', 'bad'); go('diary'); return false; } return true; }
A.edNew = () => { if (needOpen()) openEditor(blankEntry()); };
A.edToday = () => {
  if (!needOpen()) return;
  const ex = Diary.entries.find(e => e.cat === 'Daily Journal' && e.date === dkey());
  openEditor(ex || blankEntry({ cat: 'Daily Journal', title: 'Journal · ' + fmtDate(dkey()) }));
};
A.edOpen = b => { const e = Diary.entries.find(x => x.id === b.dataset.id); if (e) openEditor(JSON.parse(JSON.stringify(e))); };
I.edType = el => { $('#edItemsBox').classList.toggle('hide', el.value !== 'todo'); if (el.value === 'todo' && !$$('#edItems .tdrow').length) $('#edItems').insertAdjacentHTML('beforeend', todoRow()); };
A.tdAdd = () => { $('#edItems').insertAdjacentHTML('beforeend', todoRow()); const r = $$('#edItems .td-t'); r[r.length - 1].focus(); };
A.tdDel = b => b.closest('.tdrow').remove();
A.edSave = () => guarded(async () => {
  const type = val('edType'), body = val('edBody'); let title = val('edTitle').trim();
  const items = $$('#edItems .tdrow').map(r => ({ t: $('.td-t', r).value.trim(), d: $('.td-d', r).checked })).filter(x => x.t);
  if (!title && !body.trim() && !items.length) { showErr('edErr', 'Add a title or some text before saving.'); return; }
  if (type === 'todo' && !items.length) { showErr('edErr', 'Add at least one to-do item.'); return; }
  const date = val('edDate'); if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showErr('edErr', 'Choose a valid date.'); return; }
  if (!title) title = (body.trim().split('\n')[0] || 'Untitled').slice(0, 60);
  const id = val('edId'); const old = id ? Diary.entries.find(x => x.id === id) : null; const now = Date.now();
  const remV = val('edRem'); let rem = remV ? new Date(remV).getTime() : null; if (rem && isNaN(rem)) rem = null;
  const e = { id: old ? old.id : uid(), type, title, body: type === 'todo' ? body : body, items: type === 'todo' ? items : [], cat: val('edCat'), date, created: old ? old.created : now, updated: now, pin: $('#edPinC').checked, fav: $('#edFavC').checked, rem, remDone: old && old.rem === rem ? old.remDone : false };
  await Diary.upsert(e); closeModal(); toast(old ? 'Entry updated' : 'Entry saved', 'ok'); refresh(); checkReminders();
});

/* ---------- PIN setup / change / remove ---------- */
function pinForm(kind) {
  const old = kind !== 'set' ? `<div class="field"><label for="pOld">Current PIN</label><input id="pOld" class="in" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>` : '';
  const nw = kind !== 'remove' ? `<div class="field"><label for="pNew">${kind === 'change' ? 'New PIN' : 'PIN'} (4 to 8 digits)</label><input id="pNew" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div class="field"><label for="pNew2">Repeat PIN</label><input id="pNew2" type="password" inputmode="numeric" maxlength="8" autocomplete="off" data-enter="pinSave"></div>` : '';
  return `${old}${nw}<div class="ferr" id="pinFormErr" hidden></div>${kind === 'set' ? '<p class="muted sm">Your diary is encrypted with this PIN. If you forget it, the entries cannot be recovered.</p>' : ''}`;
}
let pinKind = 'set';
function openPin(kind) {
  if (!Vault.supported) { toast('This view blocks the encryption a PIN needs, so a PIN cannot be set here.', 'bad'); return; }
  if ((kind === 'change' || kind === 'remove') && Diary.isLocked()) { toast('Unlock your diary first', 'bad'); go('diary'); return; }
  pinKind = kind;
  modal({ title: kind === 'set' ? 'Set diary PIN' : kind === 'change' ? 'Change PIN' : 'Remove PIN', body: pinForm(kind), actions: `<button class="btn ghost" data-act="closeModal">${t('Cancel')}</button><button class="btn ${kind === 'remove' ? 'danger' : 'pri'}" data-act="pinSave">${kind === 'remove' ? 'Remove PIN' : t('Save')}</button>` });
}
A.pinSetup = () => openPin('set'); A.pinChange = () => openPin('change'); A.pinRemove = () => openPin('remove');
A.pinSave = async () => {
  const kind = pinKind, ok = /^\d{4,8}$/;
  try {
    if (kind !== 'set') { if (!(await Diary.checkPin(val('pOld')))) { showErr('pinFormErr', 'The current PIN is not correct.'); return; } }
    if (kind !== 'remove') {
      const a = val('pNew'), b = val('pNew2');
      if (!ok.test(a)) { showErr('pinFormErr', 'The PIN must be 4 to 8 digits (numbers only).'); return; }
      if (a !== b) { showErr('pinFormErr', 'The two PINs do not match.'); return; }
      await Diary.setPin(a); toast(kind === 'set' ? 'PIN set. Your diary is now encrypted.' : 'PIN changed', 'ok');
    } else { await Diary.removePin(); toast('PIN removed. Your diary is no longer locked.'); }
    closeModal(); refresh();
  } catch (e) { showErr('pinFormErr', 'Something went wrong while saving. Please try again.'); }
};

/* ---------- reminders ---------- */
function checkReminders() {
  const bar = $('#remBar'); if (!bar) return;
  const now = Date.now(), due = D.remind.filter(r => r.at <= now);
  if (!due.length) { bar.innerHTML = ''; return; }
  const open = !Diary.isLocked();
  bar.innerHTML = due.map(r => {
    const e = open ? Diary.entries.find(x => x.id === r.id) : null;
    if (!Diary.notified[r.id]) { Diary.notified[r.id] = 1; toast('Reminder due', 'ok'); sound(880, .15); }
    return `<div class="rem">${ICON.bell}<span class="grow">${e ? 'Reminder: ' + esc(e.title) : 'A diary reminder is due. Unlock your diary to see it.'}</span><button class="btn sm" data-act="remSnooze" data-id="${r.id}">Snooze 10 min</button><button class="btn pri sm" data-act="remDone" data-id="${r.id}">Done</button></div>`;
  }).join('');
}
A.remDone = b => guarded(async () => {
  const id = b.dataset.id; D.remind = D.remind.filter(r => r.id !== id); save('remind');
  const e = Diary.entries.find(x => x.id === id); if (e) { e.remDone = true; await Diary.persist(); }
  delete Diary.notified[id]; checkReminders(); if (cur === 'diary' && !Diary.isLocked()) renderDiaryList();
});
A.remSnooze = b => guarded(async () => {
  const id = b.dataset.id, at = Date.now() + 600000, r = D.remind.find(x => x.id === id); if (r) { r.at = at; save('remind'); }
  const e = Diary.entries.find(x => x.id === id); if (e) { e.rem = at; await Diary.persist(); }
  delete Diary.notified[id]; checkReminders();
});

const Formulas = {
  all() { return FORMULAS.concat(D.pFormulas.map(x => Object.assign({}, x, { builtin: false }))); },
  byId(id) { return this.all().find(x => x.id === id); },
  ofDay(k) { const all = FORMULAS; return all[dayIndex(k || dkey()) % all.length]; },
  tab: 'all', cat: 'All', q: ''
};
function fmx(s, user) { return fm(user ? userMath(s) : s); }

Views.formulas = {
  render(el) {
    el.innerHTML = pageHead('Formula Book', FORMULAS.length + ' built-in formulas across 15 topics, plus your own.', `<button class="btn pri" data-act="fNew">${ICON.plus}Add my formula</button>`) +
      tabsHTML([['all', 'All'], ['fav', 'Favourites'], ['recent', 'Recently viewed'], ['mine', 'My formulas']], Formulas.tab, 'fTab') +
      `<div class="card"><div class="field"><label for="fq">${t('Search')}</label><input id="fq" type="search" placeholder="Search by name, topic or meaning" value="${esc(Formulas.q)}" data-inp="fSearch"></div>
      <div class="chips mt" id="fcats"></div></div><div class="mt" id="flist"></div>`;
    renderFList();
  }
};
function renderFList() {
  const cc = $('#fcats'); if (cc) cc.innerHTML = ['All'].concat(FCATS).map(c => `<button class="chip ${Formulas.cat === c ? 'on' : ''}" data-act="fCat" data-v="${c}">${c}</button>`).join('');
  const host = $('#flist'); if (!host) return;
  let list = Formulas.all();
  if (Formulas.tab === 'fav') list = list.filter(x => D.favF.includes(x.id));
  else if (Formulas.tab === 'recent') list = D.recentF.map(id => list.find(x => x.id === id)).filter(Boolean);
  else if (Formulas.tab === 'mine') list = list.filter(x => !x.builtin);
  if (Formulas.cat !== 'All') list = list.filter(x => x.cat === Formulas.cat);
  const q = Formulas.q.trim().toLowerCase();
  if (q) list = list.filter(x => (x.name + ' ' + x.cat + ' ' + x.explain + ' ' + plain(x.expr)).toLowerCase().includes(q));
  const msg = Formulas.tab === 'fav' ? ['No favourites yet', 'Open a formula and press the star to keep it here.'] : Formulas.tab === 'recent' ? ['Nothing viewed yet', 'Formulas you open will appear here.'] : Formulas.tab === 'mine' ? ['No personal formulas yet', 'Press “Add my formula” to write your own.'] : ['No formulas found', 'Try a different word or topic.'];
  host.innerHTML = list.length ? `<div class="fgrid">${list.map(x => `<button class="fcard" data-act="fOpen" data-id="${x.id}"><div class="grow"><div class="b">${esc(x.name)} ${x.builtin ? '' : '<span class="badge warn">Mine</span>'}</div><div class="expr">${fmx(x.expr, !x.builtin)}</div><div class="xs muted">${esc(x.cat)}</div></div>${D.favF.includes(x.id) ? `<span style="color:var(--accent)">${ICON.star}</span>` : ''}</button>`).join('')}</div>` : `<div class="card">${emptyBox(msg[0], msg[1])}</div>`;
}
A.fTab = b => { Formulas.tab = b.dataset.v; refresh(); };
A.fCat = b => { Formulas.cat = b.dataset.v; renderFList(); };
I.fSearch = el => { Formulas.q = el.value; renderFList(); };

const Rec = {
  attempt(o) {
    const day = dkey();
    D.attempts.unshift(Object.assign({ id: uid(), ts: Date.now(), day }, o));
    if (D.attempts.length > 3000) D.attempts.length = 3000;
    const d = D.daily[day] || (D.daily[day] = { q: 0, ok: 0, secs: 0 });
    d.q++; if (o.ok) d.ok++; d.secs += clamp(o.secs || 0, 0, 600);
    save('attempts'); save('daily');
  },
  mistake(q, ua, src) {
    if (D.mistakes.some(m => !m.solved && m.q === q.q)) return;
    D.mistakes.unshift({ id: uid(), ts: Date.now(), day: dkey(), cat: q.cat, lvl: q.lvl, q: q.q, ua: String(ua), ans: Q.fmtAns(q), ansNum: q.ans, dp: q.dp, steps: q.steps, src: src || 'Practice', solved: false, solvedTs: null, retries: [] });
    if (D.mistakes.length > 1000) D.mistakes.length = 1000;
    save('mistakes');
  },
  todayCount() { const d = D.daily[dkey()]; return d ? d.q : 0; },
  streak() {
    const days = Object.keys(D.daily).filter(k => D.daily[k].q > 0).sort();
    const set = new Set(days); let cur = 0, d = new Date();
    if (!set.has(dkey(d))) d.setDate(d.getDate() - 1);
    while (set.has(dkey(d))) { cur++; d.setDate(d.getDate() - 1); }
    let best = 0, run = 0, prev = null;
    days.forEach(k => { const i = dayIndex(k); run = (prev !== null && i === prev + 1) ? run + 1 : 1; prev = i; if (run > best) best = run; });
    return { cur, best: Math.max(best, cur) };
  }
};

    after() { this.calc(); },
    calc() {

A.tlRefresh = async () => {
  if (Tl.ratesBusy) return; Tl.ratesBusy = true; Tl.ratesMsg = ''; renderTool();
  try {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 7000);
    const res = await fetch('https://open.er-api.com/v6/latest/USD', { signal: ctl.signal }); clearTimeout(tm);
    if (!res.ok) throw new Error('http');
    const j = await res.json(); if (!j || j.result !== 'success' || !j.rates) throw new Error('bad');
    const rates = {}; Object.keys(CURS).forEach(k => { if (!(j.rates[k] > 0)) throw new Error('missing'); rates[k] = j.rates[k]; });
    D.rates = { ts: (j.time_last_update_unix || Date.now() / 1000) * 1000, live: true, source: 'Live rates from open.er-api.com', rates }; save('rates'); Tl.ratesMsg = 'Rates updated.';
  } catch (e) { Tl.ratesMsg = 'Could not reach the rate service from here, so the saved rates are still in use.'; }
  Tl.ratesBusy = false; if (cur === 'tools' && Tl.tab === 'cur') renderTool();
};

/* ---------- data: backup, restore, export, clear ---------- */
function dataHTML() {

}
const BK_KEYS = () => Store.keys();
function backupJSON() { const data = {}; BK_KEYS().forEach(k => { data[k] = Store.get(k, null); }); return JSON.stringify({ app: 'SmartMate', version: 1, created: new Date().toISOString(), data }, null, 1); }
A.bkMake = () => saveFile('smartmate-backup-' + dkey() + '.json', backupJSON(), backupJSON());
A.bkCopy = () => copyText(backupJSON(), 'Backup copied. Paste it into a safe place.');
I.rsText = el => { St.rest = el.value; };
I.rsFile = el => {
  const f = el.files && el.files[0]; if (!f) return; if (f.size > 20 * 1024 * 1024) return showErr('rsErr', 'That file is too large to be a SmartMate backup.');
  const r = new FileReader(); r.onload = () => { St.rest = String(r.result); const t = $('#rsText'); if (t) t.value = St.rest; showErr('rsErr', ''); toast('File loaded. Press “Restore data” to continue.'); }; r.onerror = () => showErr('rsErr', 'The file could not be read.'); r.readAsText(f);
};
A.rsGo = () => {

  if (!j || j.app !== 'SmartMate' || !j.data || typeof j.data !== 'object') return showErr('rsErr', 'This file is not a SmartMate backup.');
  const keys = Object.keys(j.data); if (!keys.length) return showErr('rsErr', 'The backup is empty.');
  confirmBox('Restore ' + keys.length + ' data groups from the backup created ' + (j.created ? fmtDT(Date.parse(j.created)) : 'earlier') + '? This replaces your current data.', 'Restore', () => {
    BK_KEYS().forEach(k => Store.del(k)); keys.forEach(k => { if (/^[A-Za-z0-9_-]+$/.test(k)) Store.set(k, j.data[k]); });

/* ---------- export builders ---------- */
function plainFormula(x) { const u = !x.builtin; const p = s => plain(u ? userMath(s) : s); return [x.name + ' (' + x.cat + ')', 'Formula: ' + p(x.expr), 'Meaning: ' + p(x.explain), 'Variables: ' + p(x.vars), 'When to use: ' + p(x.when), 'Example: ' + p(x.ex), 'Solution:'].concat(x.steps.map((s, i) => '  ' + (i + 1) + '. ' + p(s))); }
function buildExport(kind) {
  const need = () => { if (Diary.isLocked()) { toast('Unlock your diary first', 'bad'); return false; } return true; };
  const L = []; let title = '';
  if (kind === 'diary' || kind === 'notes') {
    if (!need()) return null;
    const list = Diary.sorted(Diary.entries).filter(e => kind === 'diary' ? e.type === 'diary' : e.type !== 'diary');
    if (!list.length) { toast('There is nothing to export yet', 'bad'); return null; }
    title = kind === 'diary' ? 'SmartMate diary entries' : 'SmartMate personal notes';
    list.forEach(e => { L.push({ s: 'h', t: e.title }); L.push({ s: 's', t: fmtDate(e.date) + ' · ' + e.cat + ' · ' + TYPES[e.type] + (e.pin ? ' · pinned' : '') + (e.fav ? ' · favourite' : '') }); if (e.items && e.items.length) e.items.forEach(i => L.push({ s: 'p', t: (i.d ? '[x] ' : '[ ] ') + i.t })); if (e.body) L.push({ s: 'p', t: e.body }); L.push({ s: 'g', t: '' }); });
  } else if (kind === 'formulas') {
    const list = Formulas.all().filter(x => !x.builtin || D.favF.includes(x.id) || true); title = 'SmartMate formula collection';
    list.forEach(x => { const ls = plainFormula(x); L.push({ s: 'h', t: ls[0] }); ls.slice(1).forEach(l => L.push({ s: 'p', t: l })); L.push({ s: 'g', t: '' }); });
  } else if (kind === 'exams') {
    if (!D.exams.length) { toast('There are no exam results to export yet', 'bad'); return null; }
    title = 'SmartMate examination results';
    D.exams.slice().reverse().forEach(e => { L.push({ s: 'h', t: e.cfg.subject + (e.cfg.topic !== 'All topics' ? ' · ' + e.cfg.topic : '') + ' · ' + fmtDT(e.ts) }); L.push({ s: 'p', t: `Score ${e.got}/${e.marks} (${e.acc}%) · ${e.correct} correct, ${e.wrong} incorrect, ${e.skip} unanswered · time ${fmtDur(e.secs)}` }); e.items.forEach((it, i) => { L.push({ s: 'p', t: `Q${i + 1}. ${plain(it.q)}` }); L.push({ s: 's', t: `Your answer: ${it.ua} | Correct: ${it.ans} | ${it.st === 'ok' ? 'Correct' : it.st === 'bad' ? 'Incorrect' : 'Unanswered'}` }); }); L.push({ s: 'g', t: '' }); });
  }
  return { title, lines: L };
}
A.exTxt = b => { const e = buildExport(b.dataset.k); if (!e) return; const txt = e.title + '\nExported ' + fmtDT(Date.now()) + '\n\n' + e.lines.map(l => l.s === 'h' ? '== ' + l.t + ' ==' : l.t).join('\n'); saveFile('smartmate-' + b.dataset.k + '-' + dkey() + '.txt', txt, txt); };
async function makePdf(title, lines) {
  const J = window.jspdf && window.jspdf.jsPDF; if (!J) throw new Error('nopdf');
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { }
  const W = 794, H = 1123, M = 60, SC = 2, FONT = "'Nunito','Noto Sans Bengali',Arial,sans-serif";
  const doc = new J({ unit: 'pt', format: 'a4' }); let page = 0, cv, ctx, y;
  const newPage = () => { if (cv) flush(); cv = document.createElement('canvas'); cv.width = W * SC; cv.height = H * SC; ctx = cv.getContext('2d'); ctx.scale(SC, SC); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.textBaseline = 'alphabetic'; y = M; page++; };
  const flush = () => { if (page > 1) doc.addPage(); doc.addImage(cv.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 595.28, 841.89); };
  const wrap = (text, w) => { const out = []; String(text).split('\n').forEach(par => { if (par === '') { out.push(''); return; } let line = ''; par.split(/(\s+)/).forEach(tok => { const t = line + tok; if (ctx.measureText(t).width > w && line) { out.push(line.trimEnd()); line = tok.trimStart(); } else line = t; if (ctx.measureText(line).width > w) { let c = ''; Array.from(line).forEach(ch => { if (ctx.measureText(c + ch).width > w) { out.push(c); c = ch; } else c += ch; }); line = c; } }); out.push(line.trimEnd()); }); return out; };
  newPage();
  const put = (text, size, weight, color, gap) => { ctx.font = weight + ' ' + size + 'px ' + FONT; ctx.fillStyle = color; wrap(text, W - 2 * M).forEach(l => { if (y + size * 1.4 > H - M) { newPage(); ctx.font = weight + ' ' + size + 'px ' + FONT; ctx.fillStyle = color; } y += size * 1.4; ctx.fillText(l, M, y); }); y += gap; };
  put(title, 26, '800', '#4b3a7a', 4); put('Exported ' + fmtDT(Date.now()), 12, '400', '#777', 14);
  lines.forEach(l => { if (l.s === 'h') { y += 6; put(l.t, 17, '800', '#4b3a7a', 2); } else if (l.s === 's') put(l.t, 11.5, '400', '#777', 4); else if (l.s === 'g') y += 8; else put(l.t, 13, '400', '#222', 4); });
  flush(); return doc.output('blob');
}
A.exPdf = async b => {
  const e = buildExport(b.dataset.k); if (!e) return;
  try { toast('Building PDF…'); const blob = await makePdf(e.title, e.lines); await saveFile('smartmate-' + b.dataset.k + '-' + dkey() + '.pdf', blob); }
  catch (err) { toast('The PDF could not be created here. Use the TXT export instead.', 'bad'); }
};
